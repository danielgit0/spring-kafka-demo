spring:
  application:
    name: kafka-demo
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      enabled: false # disabled as I am using podman, should work in a docker setup
      file: classpath:docker/compose.yml
  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    admin:
      auto-create: true
      modify-topic-configs: true
    properties:
      schema.registry.url: http://localhost:8083
      value.subject.name.strategy: io.confluent.kafka.serializers.subject.RecordNameStrategy
      key.subject.name.strategy: io.confluent.kafka.serializers.subject.TopicRecordNameStrategy
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        enable.idempotence: true
        acks: all
        retries: 3
        replication.factor: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
#        group:
#          id: kafka-demo
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        specific.avro.reader: true
        value.subject.name.strategy: io.confluent.kafka.serializers.subject.RecordNameStrategy
    streams:
      application-id: kafka-playground-app
      bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde
        # Maps the Streams internal client to Redpanda's Schema Registry
        schema.registry.url: http://localhost:8083

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  otlp:
    metrics:
      export:
        enabled: true
#        endpoint: http://localhost:4318/v1/metrics
        step: 10s
    tracing:
#      endpoint: http://localhost:4318/v1/traces
      sampling:
        probability: 1.0

logging:
  level:
    com.example.kafka: DEBUG
    org.apache.kafka: INFO
    org.springframework.kafka: INFO
